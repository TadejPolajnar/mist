[package]
name = "mistc"
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "Compiler for .mist single-file components (TS frontmatter + JSX-ish template + Tailwind) targeting native WeChat Mini Program code"
keywords = ["wechat", "miniprogram", "compiler", "wxml", "frontend"]
categories = ["compilers", "web-programming"]

[lib]
name = "mistc"
path = "src/lib.rs"

[[bin]]
name = "mistc"
path = "src/main.rs"

[dependencies]
oxc_allocator = "0.36"
oxc_parser = "0.36"
oxc_ast = "0.36"
oxc_span = "0.36"
oxc_syntax = "0.36"
regex = "1"
clap = { version = "4", features = ["derive"] }
notify = "8"

[workspace]
members = ["crates/mistc-lsp"]
resolver = "2"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
