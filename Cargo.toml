[package]
name = "mistc"
version = "0.1.0"
edition = "2021"

[lib]
name = "mistc"
path = "src/lib.rs"

[[bin]]
name = "mistc"
path = "src/main.rs"

[features]
# Exposes the compiler's internal modules (parser, analysis, emitters) for
# tooling such as editor integrations. Not covered by semver.
internals = []

[dev-dependencies]
mistc = { path = ".", features = ["internals"] }

[dependencies]
oxc_allocator = "0.36"
oxc_parser = "0.36"
oxc_ast = "0.36"
oxc_span = "0.36"
regex = "1"
