name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Warm the Tailwind CLI cache
        run: |
          mkdir -p ~/.cache/mistc/tw4
          cd ~/.cache/mistc/tw4
          echo '{ "name": "mistc-tw", "private": true }' > package.json
          npm install --no-audit --no-fund tailwindcss@^4 @tailwindcss/cli@^4
      - run: cargo build --workspace
      - run: cargo test --workspace
