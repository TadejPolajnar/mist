[package]
name = "mistc-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Language server for .mist single-file components (diagnostics, completions, hover, rename)"
keywords = ["wechat", "miniprogram", "lsp", "language-server"]
categories = ["development-tools"]

[dependencies]
mistc = { path = "../.." }
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
regex = "1"
